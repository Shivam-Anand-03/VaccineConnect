version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: vaccine_postgres
    restart: always
    environment:
      POSTGRES_USER: madhav
      POSTGRES_PASSWORD: madhav
      POSTGRES_DB: vaccine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vaccine_network

volumes:
  pgdata:

networks:
  vaccine_network:
    driver: bridge
